<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>Cipher</title><style>*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}body{background:#0b1220;color:#e6edf6;height:100vh;display:flex;flex-direction:column}header{padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e293b}#t{cursor:pointer}.st{font-size:11px;font-weight:600;padding:4px 8px;border-radius:12px;cursor:pointer}.net{color:#34d399;background:#064e3b55}.lora{color:#fbbf24;background:#78350f66}.wifi{color:#60a5fa;background:#1e3a8a66}.off{color:#f87171;background:#7f1d1d55}main{flex:1;overflow:auto;display:flex;flex-direction:column}nav{display:flex;border-top:1px solid #1e293b}nav button{flex:1;padding:12px 0;background:none;border:0;color:#94a3b8;font-size:12px;cursor:pointer}nav button.on{color:#60a5fa;font-weight:600}.row{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #111a2e;cursor:pointer}.av{width:40px;height:40px;border-radius:50%;background:#1e3a8a;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}.sub{font-size:12px;color:#94a3b8}.msgs{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}.b{max-width:80%;padding:8px 12px;border-radius:14px;font-size:14px}.me{align-self:flex-end;background:#2563eb}.th{align-self:flex-start;background:#1e293b}.tag{display:block;font-size:10px;opacity:.8;margin-top:3px}.bar{display:flex;gap:8px;padding:10px;border-top:1px solid #1e293b}.bar input{flex:1;min-width:0;background:#111a2e;border:1px solid #1e293b;color:#fff;border-radius:20px;padding:8px 12px}.cnt{font-size:10px;color:#94a3b8;text-align:right;padding:0 14px 4px}.btn{background:#2563eb;color:#fff;border:0;border-radius:20px;padding:8px 14px;cursor:pointer}.ghost{background:#1e293b}.card{margin:14px;padding:16px;background:#111a2e;border-radius:12px}.lock{font-size:11px;color:#94a3b8;text-align:center;padding:6px}.tg{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #111a2e;font-size:14px}.kv{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid #1e293b}.kv span:first-child{color:#94a3b8}.dev{font-size:44px;text-align:center;margin:6px 0}.warn{font-size:12px;color:#fbbf24;margin-top:8px}.mono{font-family:monospace;font-size:11px;word-break:break-all;background:#0b1220;padding:8px;border-radius:8px;margin:8px 0}#qr{display:block;margin:10px auto;background:#fff;padding:8px;border-radius:8px;width:200px;height:200px}</style></head><body><header><span id='t'>Welcome</span><span class='st' id='s'></span></header><main id='m'></main><nav id='n'></nav><script>
/* Native bridge (window.Cipher) is injected by MainActivity: identity, invites, QR, safety numbers.
   Transports below are still simulated in this build. */
var N=window.Cipher||null;
var S={tab:'chats',chat:null,on:N?N.hasIdentity():false,radio:0,offline:false,chats:[]};
var m=document.getElementById('m'),t=document.getElementById('t'),n=document.getElementById('n'),s=document.getElementById('s');
function $(i){return document.getElementById(i)}
function link(){if(!S.offline||S.wnet)return 'net';if(S.wifi)return 'wifi';return S.radio==2?'lora':'off'}
function chip(){var l=link();s.className='st '+l;s.textContent=l=='wifi'?'📶 Wi-Fi Direct':l=='net'?(S.wnet?'● Wi-Fi · '+S.wnet:'● Internet'):l=='lora'?'📡 LoRa':'○ No link';s.onclick=function(){S.tab='radio';S.chat=null;draw()};s.style.display=S.on?'':'none'}
function nav(){n.innerHTML='';['chats','contacts','nearby','radio','settings'].forEach(function(k){var b=document.createElement('button');b.type='button';b.textContent=k[0].toUpperCase()+k.slice(1);if(S.tab==k&&S.chat===null)b.className='on';b.onclick=function(){S.tab=k;S.chat=null;draw()};n.appendChild(b)});n.style.display=S.on?'flex':'none'}
function loadContacts(){if(!N)return;try{var cs=JSON.parse(N.contacts());cs.forEach(function(c){if(!S.chats.some(function(x){return x.a==c.address}))S.chats.push({n:c.name,a:c.address,m:[['th','Key pinned via invite ✓']]})})}catch(e){}}
function send(){var v=$('in').value.trim();if(!v)return;var c=S.chats[S.chat],l=link();if(l=='lora'&&v.length>200){$('w').textContent='Too long for LoRa — keep under 200 characters';return}var tag=l=='net'?'🔒 encrypted · queued for P2P link':l=='wifi'?'📶 via Wi-Fi Direct · '+S.wifi:l=='lora'?'📡 via LoRa':'⏳ Queued — sends when a link is available';c.m.push(['me',v,tag]);draw()}
function row(txt,btn,on,fn){var r=document.createElement('div');r.className='kv';r.style.alignItems='center';r.innerHTML=`<span></span><button class='btn' type='button'></button>`;r.querySelector('span').textContent=txt;var b=r.querySelector('button');b.textContent=btn;if(on)b.className='btn ghost';b.onclick=function(){fn(b)};return r}
function draw(){nav();chip();t.onclick=null;
if(!S.on){t.textContent='Welcome';m.innerHTML=`<div class='card'><h3>Create your identity</h3><p class='sub' style='margin:8px 0 14px'>Keys are generated inside this phone's secure hardware. No phone number, no email, no server.</p><input id='nm' placeholder='Display name (optional)' maxlength='32' style='width:100%;background:#0b1220;border:1px solid #1e293b;color:#fff;border-radius:10px;padding:10px;margin-bottom:12px'><button class='btn' type='button' id='go'>Generate keys</button></div>`;$('go').onclick=function(){this.textContent='Generating keys…';var nm=$('nm').value.trim();setTimeout(function(){if(N)N.createIdentity(nm);S.on=true;draw()},50)};return}
loadContacts();
if(S.chat!==null){var c=S.chats[S.chat],l=link();t.textContent='‹ '+c.n;t.onclick=function(){S.chat=null;draw()};m.innerHTML=`<div class='lock'>🔒 End-to-end encrypted · identity pinned</div><div class='msgs' id='ms'></div>`;c.m.forEach(function(x){var d=document.createElement('div');d.className='b '+x[0];d.textContent=x[1];if(x[2]){var g=document.createElement('span');g.className='tag';g.textContent=x[2];d.appendChild(g)}$('ms').appendChild(d)});var cn=document.createElement('div');cn.className='cnt';cn.id='w';m.appendChild(cn);var bar=document.createElement('div');bar.className='bar';bar.innerHTML=`<input id='in' placeholder='Message'><button class='btn' type='button' id='sd'>Send</button>`;m.appendChild(bar);$('sd').onclick=send;$('in').onkeydown=function(e){if(e.key=='Enter')send()};return}
if(S.tab=='chats'){t.textContent='Chats';m.innerHTML='';if(!S.chats.length){m.innerHTML=`<div class='card'><h3>No contacts yet</h3><p class='sub' style='margin-top:6px'>Go to Contacts and share your invite link or QR code.</p></div>`;return}S.chats.forEach(function(c,i){var r=document.createElement('div');r.className='row';r.innerHTML=`<div class='av'></div><div><div class='nm'></div><div class='sub'></div></div>`;r.querySelector('.av').textContent=(c.n||'?')[0];r.querySelector('.nm').textContent=c.n;r.querySelector('.sub').textContent=c.m[c.m.length-1][1];r.onclick=function(){S.chat=i;draw()};m.appendChild(r)});return}
if(S.tab=='contacts'){t.textContent='Contacts';m.innerHTML=`<div class='card'><h3>🔗 Your invite</h3><p class='sub' style='margin:6px 0'>Signed by your key · single use · expires in 24 h. No phone numbers.</p><img id='qr' alt='Invite QR' style='display:none'><div class='mono' id='lb' style='display:none'></div><div style='display:flex;gap:8px;flex-wrap:wrap'><button class='btn' type='button' id='mk'>Create invite</button><button class='btn ghost' type='button' id='sh' style='display:none'>Share</button></div></div><div class='card'><h3>➕ Add a contact</h3><p class='sub' style='margin:6px 0 10px'>Paste an invite link you received.</p><input id='pi' placeholder='cipher://invite#…' style='width:100%;background:#0b1220;border:1px solid #1e293b;color:#fff;border-radius:10px;padding:10px;margin-bottom:10px'><button class='btn' type='button' id='ad'>Verify &amp; add</button><p class='sub' id='im' style='margin-top:8px'></p></div><div class='card'><h3>Your address</h3><div class='mono' id='ad2'></div></div>`;$('ad2').textContent=N?N.address():'(native bridge unavailable)';
$('mk').onclick=function(){if(!N)return;var r=JSON.parse(N.createInvite());$('lb').textContent=r.link;$('lb').style.display='block';$('qr').src=r.qr;$('qr').style.display='block';$('sh').style.display='';$('sh').onclick=function(){N.share(r.link)};this.textContent='New invite'};
$('ad').onclick=function(){if(!N)return;var r=JSON.parse(N.acceptInvite($('pi').value.trim()));$('im').textContent=r.ok?('✓ '+r.name+' added — signature verified, key pinned. Safety number: '+r.safety):'✗ Invalid or expired invite';if(r.ok){S.chats=[];loadContacts()}};return}
if(S.tab=='nearby'){t.textContent='Nearby';m.innerHTML=`<div class='card'><h3>🌐 Wi-Fi internet</h3><p class='sub' style='margin:6px 0 10px'>Reach invited contacts anywhere — encrypted P2P, no message server.</p><div id='wl'></div></div><div class='card'><h3>📶 Wi-Fi Direct</h3><p class='sub' style='margin:6px 0 10px'>Phone-to-phone Wi-Fi up to ~200 m, no router. (Simulated in this build.)</p><div id='pl'></div></div><label class='tg'><span>Offline mode (simulate no internet)</span><input type='checkbox' id='of2'></label>`;[['Home-5G'],['Office-Guest']].forEach(function(w){var on=S.wnet==w[0];$('wl').appendChild(row(w[0],on?'Connected ✓':'Join',on,function(){S.wnet=on?null:w[0];draw()}))});S.chats.slice(0,3).forEach(function(p){var on=S.wifi==p.n;$('pl').appendChild(row(p.n,on?'Connected ✓':'Connect',on,function(){S.wifi=on?null:p.n;draw()}))});$('of2').checked=S.offline;$('of2').onchange=function(){S.offline=this.checked;draw()};return}
if(S.tab=='radio'){t.textContent='Radio';m.innerHTML=`<div class='card' style='text-align:center'><div class='dev'>${S.radio==2?'📡':'🔌'}</div><h3>${S.radio==2?'Radio connected':'No radio connected'}</h3><p class='sub' style='margin:8px 0 14px'>Plug a LoRa radio (Heltec V3, RAK4631, T-Beam) into USB-C with an OTG cable. (Simulated in this build.)</p><button class='btn' type='button' id='pl'>${S.radio==2?'Disconnect':'Simulate plug-in'}</button></div><label class='tg'><span>Offline mode (simulate no internet)</span><input type='checkbox' id='of'></label>`;$('pl').onclick=function(){S.radio=S.radio==2?0:2;draw()};$('of').checked=S.offline;$('of').onchange=function(){S.offline=this.checked;draw()};return}
t.textContent='Settings';m.innerHTML=`<div class='card'><h3>Security status</h3><div id='sec'></div></div><div class='card'><button class='btn' type='button' id='wipe' style='background:#b91c1c'>Panic wipe (destroy keys)</button><p class='sub' id='wm' style='margin-top:8px'>Permanently destroys your identity and makes all local data unreadable.</p></div>`;if(N){var st=JSON.parse(N.status());Object.keys(st).forEach(function(k){var r=document.createElement('div');r.className='kv';r.innerHTML='<span></span><span></span>';r.children[0].textContent=k;r.children[1].textContent=st[k];$('sec').appendChild(r)})}var armed=false;$('wipe').onclick=function(){if(!armed){armed=true;this.textContent='Tap again to confirm';return}if(N)N.panicWipe();S={tab:'chats',chat:null,on:false,radio:0,offline:false,chats:[]};draw()}}
draw();
</script></body></html>
